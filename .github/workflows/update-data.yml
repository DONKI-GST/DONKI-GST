name: Atualizar dados DONKI-GST

on:
  schedule:
    - cron: "0 */6 * * *"   # a cada 6 horas (UTC)
  workflow_dispatch:
    inputs:
      dias:
        description: "Quantos dias para trás coletar"
        required: false
        default: "180"

permissions:
  contents: read

concurrency:
  group: update-data-donki-gst
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests

      - name: Coletar e gravar no Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          DIAS: ${{ github.event.inputs.dias || '180' }}
        run: python scripts/fetch_nasa.py
